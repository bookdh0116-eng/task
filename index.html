<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101419">
<meta name="description" content="컴퓨터와 태블릿에서 사용하는 미니멀 플립 시계">
<title>Flip Clock — 조용한 시간</title>
<style>
:root{color-scheme:dark;--bg:#101419;--panel:#252b33;--bottom:#20262e;--edge:#38404b;--text:#f5f4ef;--muted:#9aa3aa;--accent:#c8dfb9;--control:#1d232b;--shadow:#0005;--digit-w:clamp(60px,12vw,178px);--digit-h:calc(var(--digit-w)*1.35);--font:calc(var(--digit-w)*.95)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body:before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse 63% 48% at 50% 39%,#62788b1b,transparent 80%)}
body.light{color-scheme:light;--bg:#f2f0e9;--panel:#fffefa;--bottom:#f4f1ea;--edge:#ddd9d1;--text:#282c30;--muted:#7d8284;--accent:#567954;--control:#e8e6df;--shadow:#403b2e27}
body.light:before{background:radial-gradient(ellipse 65% 50% at 50% 38%,#ffffffaa,transparent 80%)}
body.pure-black{color-scheme:dark;--bg:#000000;--panel:#000000;--bottom:#000000;--edge:#303030;--text:#ffffff;--muted:#a9a9a9;--accent:#ffffff;--control:#000000;--shadow:#0009}
body.pure-white{color-scheme:light;--bg:#ffffff;--panel:#ffffff;--bottom:#ffffff;--edge:#d4d4d4;--text:#000000;--muted:#646464;--accent:#000000;--control:#ffffff;--shadow:#00000018}
body.pure-black:before,body.pure-white:before{background:none}
.app{min-height:100svh;position:relative;display:flex;flex-direction:column;padding:clamp(20px,3vw,42px) clamp(17px,4vw,68px)}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:11px;color:var(--accent);font-size:21px;font-weight:800}
.brand-name{font-size:13px;letter-spacing:.24em;font-weight:800}.brand-sub{font-size:10px;letter-spacing:.13em;color:var(--muted);margin-top:5px}
.date{color:var(--muted);font-size:clamp(11px,1.15vw,15px);text-align:right}
main{flex:1;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 0}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.25em;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:clamp(26px,3.6vw,50px)}
.live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.clock{display:flex;justify-content:center;align-items:center;gap:clamp(6px,1.45vw,21px);max-width:100%;perspective:1400px}
.pair{display:flex;gap:clamp(5px,.65vw,10px)}
.digit{width:var(--digit-w);height:var(--digit-h);position:relative;flex:none;filter:drop-shadow(0 12px 12px var(--shadow));font-variant-numeric:tabular-nums;user-select:none}
.half{width:100%;height:50%;position:absolute;left:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.half span{position:absolute;left:0;width:100%;height:200%;display:flex;align-items:center;justify-content:center;font:700 var(--font)/1 Arial,"Helvetica Neue",sans-serif;letter-spacing:-.065em;padding-right:.065em}
.top,.fold-top{top:0;background:var(--panel);border:1px solid var(--edge);border-bottom:none;border-radius:12px 12px 2px 2px}
.bottom,.fold-bottom{bottom:0;background:var(--bottom);border:1px solid var(--edge);border-top:none;border-radius:2px 2px 12px 12px}
.top span,.fold-top span{top:0}.bottom span,.fold-bottom span{top:-100%}
.top,.bottom{z-index:1}.fold-top{z-index:5;transform-origin:bottom;display:none}.fold-bottom{z-index:4;transform-origin:top;display:none;transform:rotateX(90deg)}
.digit:after{content:"";position:absolute;top:calc(50% - 1px);left:0;right:0;height:2px;background:#0005;z-index:7;pointer-events:none}
.digit.flipping .fold-top{display:block;animation:fold .34s cubic-bezier(.55,.12,.86,.48) forwards}
.digit.flipping .fold-bottom{display:block;animation:unfold .34s .34s cubic-bezier(.12,.58,.28,1) forwards}
@keyframes fold{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes unfold{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.colon{height:var(--digit-h);width:clamp(14px,2.1vw,29px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vw,42px)}
.colon i{width:clamp(7px,.85vw,12px);height:clamp(7px,.85vw,12px);background:var(--accent);border-radius:50%}
.seconds-part{display:none!important}body.seconds-on{--digit-w:clamp(39px,8.4vw,125px)}body.seconds-on .seconds-part{display:flex!important}
.below{margin-top:clamp(28px,3.5vw,50px);display:flex;gap:15px;align-items:center;color:var(--muted);font-size:clamp(12px,1.1vw,14px)}
.period{color:var(--text);font-weight:650}.bar{height:13px;border-left:1px solid var(--edge)}
.caption{margin-top:42px;font-size:10px;color:var(--muted);letter-spacing:.2em}
footer{padding-top:20px;border-top:1px solid var(--edge)}.hint{font-size:12px;color:var(--muted)}
.controls{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;font-weight:650;color:var(--text);background:var(--control);border:1px solid var(--edge);border-radius:12px;min-height:43px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:background .2s,transform .15s;-webkit-tap-highlight-color:transparent}
button:hover{background:color-mix(in srgb,var(--control) 72%,var(--accent))}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{border-color:var(--accent)}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-picker{min-height:43px;display:inline-flex;align-items:center;gap:8px;padding:0 11px;border:1px solid var(--edge);border-radius:12px;background:var(--control);color:var(--text)}
.theme-picker svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.theme-picker select{font-family:inherit;font-size:12px;font-weight:650;background:transparent;color:var(--text);border:0;outline:0;cursor:pointer;max-width:125px}
.theme-picker select:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.theme-picker option{background:var(--panel);color:var(--text)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:10px 16px;color:var(--text);font-size:12px;box-shadow:0 12px 30px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.visible{opacity:1}
.zen-exit{display:none;position:fixed;bottom:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);z-index:10;opacity:.48;transition:opacity .2s}
.zen-exit:hover,.zen-exit:focus-visible{opacity:1}
body.zen .app{padding:clamp(12px,2vw,28px)}
body.zen header,body.zen footer,body.zen .eyebrow,body.zen .below,body.zen .caption{display:none}
body.zen main{min-height:0;padding:0}
body.zen{--digit-w:clamp(62px,15.2vw,224px)}
body.zen.seconds-on{--digit-w:clamp(38px,9.65vw,150px)}
body.zen .clock{cursor:pointer}
body.zen .zen-exit{display:inline-flex}
.calculator{position:fixed;inset:auto 24px 76px auto;margin:0;width:min(338px,calc(100vw - 28px));max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:22px;padding:19px;box-shadow:0 22px 80px var(--shadow);z-index:40}
.calculator::backdrop{background:#0007;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.calc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
.calc-kicker{font-size:10px;color:var(--accent);letter-spacing:.18em;font-weight:800;margin-bottom:5px}
.calc-head h2{font-size:17px;line-height:1.3;font-weight:700;margin:0}
.calc-close{width:32px;height:32px;min-height:32px;padding:0;border-radius:10px;font-size:23px;font-weight:400;line-height:1}
.calc-theme-label{font-size:11px;color:var(--muted);margin-bottom:8px;display:block}
.calc-theme-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:15px}
.calc-theme-options button{min-height:34px;padding:0 3px;font-size:11px;border-radius:9px;white-space:nowrap;background:var(--control);color:var(--text)}
.calc-theme-options button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:800}
.calc-theme-options button:focus-visible{outline-offset:2px}
.calc-screen{background:var(--bottom);border:1px solid var(--edge);border-radius:15px;padding:17px 14px 13px;margin-bottom:13px;text-align:right;min-width:0}
.calc-expression{height:18px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-display{display:block;font-family:Arial,"Helvetica Neue",sans-serif;font-size:clamp(30px,7vw,40px);font-weight:650;letter-spacing:-.04em;line-height:1.25;min-height:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.calc-clipboard{display:flex;gap:8px;margin-bottom:13px}
.calc-clipboard button{flex:1;min-height:39px;font-size:12px}
.calc-paste-fallback{display:flex;gap:6px;align-items:center;margin:-5px 0 13px}
.calc-paste-fallback[hidden],.calc-history-empty[hidden]{display:none}
.calc-paste-fallback input{min-width:0;flex:1;height:38px;background:var(--bottom);color:var(--text);border:1px solid var(--edge);border-radius:10px;padding:0 10px;font-size:14px;font-family:inherit}
.calc-paste-fallback button{min-height:38px;padding:0 10px}
.calc-paste-fallback input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.calc-grid button{width:100%;height:56px;min-height:56px;padding:0;border-radius:12px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.calc-grid .calc-action{color:var(--accent);font-size:17px}
.calc-grid .calc-operator{background:color-mix(in srgb,var(--control) 76%,var(--accent) 24%);font-size:23px}
.calc-grid .calc-equals{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:25px}
.calc-grid .calc-equals:hover{background:color-mix(in srgb,var(--accent) 85%,var(--text))}
.calc-history{margin-top:15px;border-top:1px solid var(--edge);padding-top:12px;font-size:12px}
.calc-history summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;font-weight:700;min-height:22px}
.calc-history summary::-webkit-details-marker{display:none}
.calc-history-count{font-size:10px;font-weight:500;color:var(--muted)}
.calc-history-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:5px}
.calc-history-list button{width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:8px 11px;min-height:0;border-radius:9px}
.calc-history-expression{font-size:11px;color:var(--muted)}
.calc-history-result{font-size:16px;font-weight:750}
.calc-history-empty{color:var(--muted);font-size:11px;margin:10px 0 0}
.calc-tip{margin-top:12px;text-align:center;color:var(--muted);font-size:10px;line-height:1.5}
@media(max-width:900px){:root{--digit-w:clamp(59px,18.3vw,145px)}body.seconds-on{--digit-w:clamp(37px,11.5vw,93px)}.clock{gap:clamp(5px,1.2vw,12px)}.colon{width:clamp(10px,2vw,20px)}footer{flex-direction:column-reverse;gap:18px}}
@media(max-width:550px){:root{--digit-w:clamp(54px,19.3vw,105px)}body.seconds-on{--digit-w:clamp(34px,11.85vw,65px)}.app{padding:22px 14px 25px}main{min-height:370px}.clock{gap:5px}.pair{gap:4px}.colon{width:10px;gap:17px}.colon i{width:6px;height:6px}.top,.fold-top{border-radius:7px 7px 1px 1px}.bottom,.fold-bottom{border-radius:1px 1px 7px 7px}.controls{justify-content:center}button{padding:0 11px}.hint{text-align:center}}
@media(max-width:550px){.calculator{right:12px;bottom:12px;padding:16px}.calc-grid button{height:51px;min-height:51px}}
@media(max-height:600px) and (min-width:650px){:root{--digit-w:min(12vw,115px)}body.seconds-on{--digit-w:min(8.3vw,80px)}.app{padding-top:17px;padding-bottom:13px}main{min-height:285px;padding:8px 0}.eyebrow{margin-bottom:15px}.below{margin-top:18px}.caption{margin-top:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
 <header><div class="brand"><div class="logo" aria-hidden="true">F</div><div><div class="brand-name">FLIP CLOCK</div><div class="brand-sub">조용한 시간의 기록</div></div></div><div class="date" id="date">날짜 확인 중</div></header>
 <main>
  <div class="eyebrow"><span class="live"></span>CURRENT TIME</div>
  <div class="clock" id="clock" role="timer" aria-live="off" aria-label="현재 시각">
   <div class="pair" id="hours"></div><div class="colon" aria-hidden="true"><i></i><i></i></div>
   <div class="pair" id="minutes"></div><div class="colon seconds-part" aria-hidden="true"><i></i><i></i></div>
   <div class="pair seconds-part" id="seconds"></div>
  </div>
  <div class="below"><span class="period" id="period">24시간제</span><span class="bar"></span><span id="zone">기기 현지 시간</span></div>
  <div class="caption">MAKE EVERY MOMENT COUNT</div>
 </main>
 <footer>
  <div class="hint">당신의 하루를 위한 작은 쉼표.</div>
  <nav class="controls" aria-label="시계 설정">
   <button id="hourMode" type="button" aria-label="12시간제로 변경">24H</button>
   <button id="secondsMode" type="button" aria-pressed="false">초 표시</button>
   <label class="theme-picker"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg><select id="themeSelect" aria-label="시계 색상 테마"><option value="charcoal">차콜 다크</option><option value="cream">소프트 화이트</option><option value="black">퓨어 블랙</option><option value="white">퓨어 화이트</option></select></label>
   <button id="keepAwake" type="button" aria-pressed="false" title="기기에서 지원하는 경우 화면이 자동으로 꺼지지 않도록 유지합니다. 배터리가 더 소모될 수 있습니다."><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8m-4-4v4m-5-11h2m6 0h2"/></svg><span>화면 유지</span></button>
   <button id="zenMode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg><span>시계만 보기</span></button>
   <button id="calcOpen" type="button" aria-haspopup="dialog" aria-controls="calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 5h2m4 0h2m-8 4h2m4 0h2"/></svg><span>계산기</span></button>
   <button id="fullMode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg><span>전체 화면</span></button>
  </nav>
 </footer>
</div>
<button id="exitZen" class="zen-exit" type="button" aria-label="시계 전용 모드 종료">시계 화면 종료 <span aria-hidden="true">×</span></button>
<div class="toast" id="toast" role="status"></div>
<dialog id="calculator" class="calculator" aria-labelledby="calcTitle">
 <div class="calc-head"><div><div class="calc-kicker">QUICK CALC</div><h2 id="calcTitle">간단 계산기</h2></div><button id="calcClose" class="calc-close" type="button" aria-label="계산기 닫기">×</button></div>
 <span class="calc-theme-label" id="calcThemeLabel">시계와 계산기 테마 함께 변경</span>
 <div class="calc-theme-options" role="group" aria-labelledby="calcThemeLabel">
  <button type="button" data-calc-theme="charcoal" aria-pressed="false">차콜</button>
  <button type="button" data-calc-theme="cream" aria-pressed="false">크림</button>
  <button type="button" data-calc-theme="black" aria-pressed="false">블랙</button>
  <button type="button" data-calc-theme="white" aria-pressed="false">화이트</button>
 </div>
 <div class="calc-screen"><div id="calcExpression" class="calc-expression" aria-hidden="true"></div><output id="calcDisplay" class="calc-display" aria-live="polite">0</output></div>
 <div class="calc-clipboard"><button type="button" id="calcCopy" aria-label="현재 숫자 복사">⧉ 복사</button><button type="button" id="calcPaste" aria-label="숫자 붙여넣기">▣ 붙여넣기</button></div>
 <div class="calc-paste-fallback" id="calcPasteFallback" hidden><input id="calcPasteInput" type="text" inputmode="decimal" autocomplete="off" aria-label="붙여넣을 숫자 입력" placeholder="여기에 숫자 붙여넣기"><button type="button" id="calcPasteApply">적용</button><button type="button" id="calcPasteCancel" aria-label="입력 취소">×</button></div>
 <div class="calc-grid" aria-label="계산기 숫자판">
  <button type="button" class="calc-action" data-calc="clear">AC</button><button type="button" class="calc-action" data-calc="sign">±</button><button type="button" class="calc-action" data-calc="percent">%</button><button type="button" class="calc-operator" data-calc="/">÷</button>
  <button type="button" data-calc="7">7</button><button type="button" data-calc="8">8</button><button type="button" data-calc="9">9</button><button type="button" class="calc-operator" data-calc="*">×</button>
  <button type="button" data-calc="4">4</button><button type="button" data-calc="5">5</button><button type="button" data-calc="6">6</button><button type="button" class="calc-operator" data-calc="-">−</button>
  <button type="button" data-calc="1">1</button><button type="button" data-calc="2">2</button><button type="button" data-calc="3">3</button><button type="button" class="calc-operator" data-calc="+">+</button>
  <button type="button" class="calc-action" data-calc="back" aria-label="한 자리 지우기">⌫</button><button type="button" data-calc="0">0</button><button type="button" data-calc=".">.</button><button type="button" class="calc-equals" data-calc="=">=</button>
 </div>
 <details class="calc-history" id="calcHistory"><summary>최근 계산 <span class="calc-history-count" id="calcHistoryCount">0/5 · 펼치기</span></summary><p id="calcHistoryEmpty" class="calc-history-empty">아직 계산 내역이 없습니다.</p><ol class="calc-history-list" id="calcHistoryList"></ol></details>
 <div class="calc-tip">숫자키 · Enter 계산 · Ctrl+C 복사 · Ctrl+V 붙여넣기<br>Mac은 ⌘ 단축키 사용 · Esc로 닫기</div>
</dialog>
<script>
(()=>{
 'use strict';
 const $=id=>document.getElementById(id),digits=[];
 const settings={mode12:false,seconds:false,theme:'charcoal',zen:false};
 try{const saved=JSON.parse(localStorage.getItem('flip-clock-settings'))||{};Object.assign(settings,saved);if(!saved.theme&&saved.light)settings.theme='cream'}catch(_){}
 if(!['charcoal','cream','black','white'].includes(settings.theme))settings.theme='charcoal';
 delete settings.light;
 settings.zen=false;
 let wakeLock=null,wakeRequested=false;
 function makeDigit(parent,key){
  const d=document.createElement('div');d.className='digit';d.dataset.value='';d.dataset.key=key;
  d.innerHTML='<div class="half top"><span>0</span></div><div class="half bottom"><span>0</span></div><div class="half fold-top"><span>0</span></div><div class="half fold-bottom"><span>0</span></div>';
  parent.append(d);digits.push(d);
 }
 [['hours','h'],['minutes','m'],['seconds','s']].forEach(([part,key])=>{makeDigit($(part),key+'1');makeDigit($(part),key+'2')});
 const put=(d,part,value)=>d.querySelector('.'+part+' span').textContent=value;
 function change(d,value,animate){
  const old=d.dataset.value;if(old===value)return;
  clearTimeout(d.timer);d.classList.remove('flipping');
  if(!animate||!old||matchMedia('(prefers-reduced-motion: reduce)').matches){['top','bottom','fold-top','fold-bottom'].forEach(part=>put(d,part,value));d.dataset.value=value;return}
  put(d,'top',value);put(d,'bottom',old);put(d,'fold-top',old);put(d,'fold-bottom',value);void d.offsetWidth;
  d.classList.add('flipping');d.dataset.value=value;
  d.timer=setTimeout(()=>{put(d,'bottom',value);d.classList.remove('flipping')},710);
 }
 const dateFormat=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 let previous='';
 function tick(force=false){
  const now=new Date(),hour=settings.mode12?(now.getHours()%12||12):now.getHours();
  const parts=[String(hour).padStart(2,'0'),String(now.getMinutes()).padStart(2,'0'),String(now.getSeconds()).padStart(2,'0')];
  const key=parts.join(':');if(!force&&key===previous)return;previous=key;
  [...parts.join('')].forEach((v,i)=>change(digits[i],v,!force));
  $('date').textContent=dateFormat.format(now);
  $('clock').setAttribute('aria-label',`${parts[0]}시 ${parts[1]}분${settings.seconds?' '+parts[2]+'초':''}`);
  $('period').textContent=settings.mode12?(now.getHours()<12?'오전 · 12시간제':'오후 · 12시간제'):'24시간제';
 }
 function save(){try{localStorage.setItem('flip-clock-settings',JSON.stringify(settings))}catch(_){}}
 function sync(){
  document.body.classList.toggle('light',settings.theme==='cream');
  document.body.classList.toggle('pure-black',settings.theme==='black');
  document.body.classList.toggle('pure-white',settings.theme==='white');
  document.body.classList.toggle('seconds-on',!!settings.seconds);
  $('hourMode').textContent=settings.mode12?'12H':'24H';$('hourMode').setAttribute('aria-label',settings.mode12?'24시간제로 변경':'12시간제로 변경');
  $('secondsMode').setAttribute('aria-pressed',String(settings.seconds));
  $('themeSelect').value=settings.theme;
  document.querySelectorAll('[data-calc-theme]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.calcTheme===settings.theme)));
  document.body.classList.toggle('zen',!!settings.zen);
  $('keepAwake').setAttribute('aria-pressed',String(wakeRequested));
  $('keepAwake').querySelector('span').textContent=wakeRequested?'유지 중':'화면 유지';
  document.querySelector('meta[name="theme-color"]').content={charcoal:'#101419',cream:'#f2f0e9',black:'#000000',white:'#ffffff'}[settings.theme];
 }
 $('hourMode').addEventListener('click',()=>{settings.mode12=!settings.mode12;save();sync();tick(true)});
 $('secondsMode').addEventListener('click',()=>{settings.seconds=!settings.seconds;save();sync();tick(true)});
 function setTheme(theme){if(!['charcoal','cream','black','white'].includes(theme))return;settings.theme=theme;save();sync()}
 $('themeSelect').addEventListener('change',event=>setTheme(event.target.value));
 document.querySelectorAll('[data-calc-theme]').forEach(button=>button.addEventListener('click',()=>setTheme(button.dataset.calcTheme)));
 let toastTimer;
 function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2600)}
 function setZen(value){settings.zen=value;sync();if(value)toast('시계를 터치하거나 Esc 키로 돌아갈 수 있습니다.')}
 $('zenMode').addEventListener('click',()=>setZen(true));
 $('exitZen').addEventListener('click',()=>setZen(false));
 $('clock').addEventListener('click',()=>{if(settings.zen)setZen(false)});
 async function acquireWakeLock(){
  if(!wakeRequested||document.hidden||wakeLock)return;
  if(!('wakeLock' in navigator)){wakeRequested=false;sync();toast('이 브라우저는 화면 켜짐 유지를 지원하지 않습니다.');return}
  try{
   const lock=await navigator.wakeLock.request('screen');
   if(!wakeRequested){await lock.release();return}
   wakeLock=lock;
   lock.addEventListener('release',()=>{if(wakeLock===lock){wakeLock=null;if(!document.hidden&&wakeRequested){wakeRequested=false;toast('기기에서 화면 유지가 해제되었습니다.')}sync()}});
   sync();
  }catch(_){wakeRequested=false;sync();toast('기기 설정 또는 브라우저 제한으로 화면을 유지할 수 없습니다.')}
 }
 $('keepAwake').addEventListener('click',async()=>{
  wakeRequested=!wakeRequested;
  if(wakeRequested){await acquireWakeLock();if(wakeRequested)toast('화면 유지가 켜졌습니다. 배터리 소모에 유의하세요.')}
  else{const lock=wakeLock;wakeLock=null;if(lock)await lock.release().catch(()=>{});toast('화면 유지가 꺼졌습니다.')}
  sync();
 });
 const calcDialog=$('calculator');
 const calc={current:'0',stored:null,operator:null,fresh:false,expression:'',error:false};
 const calcHistory=[];
 const opLabel={'+':'+','-':'−','*':'×','/':'÷'};
 function formatCalc(value){
  if(value==='오류'||value.includes('e'))return value;
  const sign=value.startsWith('-')?'-':'',raw=sign?value.slice(1):value;
  const parts=raw.split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return sign+parts.join('.');
 }
 function renderCalc(){
  $('calcDisplay').textContent=formatCalc(calc.current);
  $('calcExpression').textContent=calc.expression||' ';
 }
 function renderCalcHistory(){
  const list=$('calcHistoryList');list.replaceChildren();
  $('calcHistoryCount').textContent=calcHistory.length+'/5 · '+($('calcHistory').open?'접기':'펼치기');
  $('calcHistoryEmpty').hidden=calcHistory.length>0;
  calcHistory.slice().reverse().forEach(entry=>{
   const item=document.createElement('li'),button=document.createElement('button');
   const expression=document.createElement('span'),result=document.createElement('span');
   button.type='button';button.title='이 결과를 계산기로 가져오기';
   expression.className='calc-history-expression';expression.textContent=entry.expression;
   result.className='calc-history-result';result.textContent=formatCalc(entry.result);
   button.append(expression,result);button.addEventListener('click',()=>applyPastedNumber(entry.result));
   item.append(button);list.append(item);
  });
 }
 function resetCalc(){
  Object.assign(calc,{current:'0',stored:null,operator:null,fresh:false,expression:'',error:false});
  renderCalc();
 }
 function resultString(value){
  if(!Number.isFinite(value))return null;
  return String(Number(value.toPrecision(12)));
 }
 function calcError(){
  Object.assign(calc,{current:'오류',stored:null,operator:null,fresh:true,expression:'0으로 나눌 수 없습니다.',error:true});
  renderCalc();
 }
 function calculate(a,b,operator){
  const raw=operator==='+'?a+b:operator==='-'?a-b:operator==='*'?a*b:a/b;
  return resultString(raw);
 }
 function enterCalc(key){
  if(key==='clear'){resetCalc();return}
  if(calc.error){if(!/^[0-9.]$/.test(key))return;resetCalc()}
  if(/^[0-9]$/.test(key)){
   if(calc.fresh){calc.current=key;calc.fresh=false;if(!calc.operator)calc.expression=''}
   else if(calc.current.replace(/\D/g,'').length<14){calc.current=calc.current==='0'?key:calc.current==='-0'?'-'+key:calc.current+key}
  }else if(key==='.'){
   if(calc.fresh){calc.current='0.';calc.fresh=false;if(!calc.operator)calc.expression=''}
   else if(!calc.current.includes('.')&&!calc.current.includes('e'))calc.current+='.';
  }else if(key==='sign'){
   if(calc.current!=='0')calc.current=calc.current.startsWith('-')?calc.current.slice(1):'-'+calc.current;
   calc.fresh=false;
  }else if(key==='percent'){
   calc.current=resultString(Number(calc.current)/100)||'0';calc.fresh=false;
  }else if(key==='back'){
   if(calc.fresh&&calc.operator){calc.operator=null;calc.stored=null;calc.expression='';calc.fresh=false}
   else{calc.current=calc.current.length<2||calc.current.length===2&&calc.current.startsWith('-')?'0':calc.current.slice(0,-1);calc.fresh=false;if(!calc.operator)calc.expression=''}
  }else if(['+','-','*','/'].includes(key)){
   if(calc.operator&&!calc.fresh){
    const answer=calculate(calc.stored,Number(calc.current),calc.operator);
    if(answer===null){calcError();return}
    calc.current=answer;calc.stored=Number(answer);
   }else if(calc.stored===null)calc.stored=Number(calc.current);
   calc.operator=key;calc.fresh=true;
   calc.expression=formatCalc(resultString(calc.stored))+` ${opLabel[key]}`;
  }else if(key==='='){
   if(!calc.operator||calc.fresh)return;
   const right=Number(calc.current),answer=calculate(calc.stored,right,calc.operator);
   if(answer===null){calcError();return}
   calc.expression=`${formatCalc(resultString(calc.stored))} ${opLabel[calc.operator]} ${formatCalc(resultString(right))} =`;
   calc.current=answer;calc.stored=null;calc.operator=null;calc.fresh=true;
   calcHistory.push({expression:calc.expression,result:answer});
   if(calcHistory.length>5)calcHistory.shift();
   renderCalcHistory();
  }else return;
  renderCalc();
 }
 function applyPastedNumber(text){
  const clean=String(text).trim().replace(/[−–]/g,'-').replace(/[，,]/g,'').replace(/\s+/g,'');
  if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(clean)||clean.length>80){toast('숫자만 붙여넣을 수 있습니다.');return false}
  const value=resultString(Number(clean));
  if(value===null){toast('계산할 수 없는 숫자입니다.');return false}
  calc.current=value;calc.error=false;calc.fresh=false;
  if(!calc.operator){calc.stored=null;calc.expression=''}
  renderCalc();toast('숫자를 가져왔습니다.');return true;
 }
 async function copyCalc(){
  if(calc.error){toast('오류 상태에서는 복사할 수 없습니다.');return}
  const value=calc.current;let copied=false;
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);copied=true}}catch(_){}
  if(!copied){
   const field=document.createElement('textarea');field.value=value;field.readOnly=true;
   field.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';calcDialog.append(field);field.select();
   try{copied=document.execCommand('copy')}catch(_){}field.remove();$('calcCopy').focus();
  }
  toast(copied?'숫자 '+formatCalc(value)+' 복사 완료':'복사할 수 없습니다. 숫자를 직접 선택해 주세요.');
 }
 function showPasteField(){
  $('calcPasteFallback').hidden=false;$('calcPasteInput').focus();
  toast('입력칸에 숫자를 붙여넣고 적용을 눌러 주세요.');
 }
 async function pasteCalc(){
  try{
   if(!navigator.clipboard?.readText)throw Error('unsupported');
   const value=await navigator.clipboard.readText();
   if(!value){toast('클립보드에 복사된 숫자가 없습니다.');return}
   applyPastedNumber(value);
  }catch(_){showPasteField()}
 }
 $('calcCopy').addEventListener('click',copyCalc);
 $('calcPaste').addEventListener('click',pasteCalc);
 $('calcPasteApply').addEventListener('click',()=>{if(applyPastedNumber($('calcPasteInput').value)){$('calcPasteFallback').hidden=true;$('calcPasteInput').value=''}});
 $('calcPasteInput').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();$('calcPasteApply').click()}});
 $('calcPasteCancel').addEventListener('click',()=>{$('calcPasteFallback').hidden=true;$('calcPasteInput').value=''});
 $('calcHistory').addEventListener('toggle',renderCalcHistory);
 $('calcOpen').addEventListener('click',()=>{calcDialog.showModal();$('calcClose').focus()});
 $('calcClose').addEventListener('click',()=>calcDialog.close());
 calcDialog.addEventListener('close',()=>$('calcOpen').focus({preventScroll:true}));
 calcDialog.querySelectorAll('[data-calc]').forEach(button=>button.addEventListener('click',()=>enterCalc(button.dataset.calc)));
 calcDialog.addEventListener('copy',event=>{
  if(event.target instanceof HTMLInputElement||event.target instanceof HTMLTextAreaElement||calc.error)return;
  if(event.clipboardData){event.clipboardData.setData('text/plain',calc.current);event.preventDefault();toast('숫자 '+formatCalc(calc.current)+' 복사 완료')}
 });
 calcDialog.addEventListener('paste',event=>{
  if(event.target instanceof HTMLInputElement)return;
  const value=event.clipboardData?.getData('text/plain');
  if(value){event.preventDefault();applyPastedNumber(value)}
 });
 calcDialog.addEventListener('keydown',event=>{
  if(event.target instanceof HTMLInputElement)return;
  if((event.ctrlKey||event.metaKey)&&!event.altKey&&event.key.toLowerCase()==='c'){
   event.preventDefault();copyCalc();return;
  }
  if(event.key==='Escape'||event.ctrlKey||event.metaKey||event.altKey)return;
  if(event.key==='Enter'&&event.code!=='NumpadEnter'&&event.target.closest('[data-calc-theme],.calc-history,.calc-paste-fallback'))return;
  const numpad={'NumpadDecimal':'.','NumpadAdd':'+','NumpadSubtract':'-','NumpadMultiply':'*','NumpadDivide':'/','NumpadEnter':'='};
  const key=/^Numpad[0-9]$/.test(event.code)?event.code.slice(-1):(numpad[event.code]||({Enter:'=',Backspace:'back',Delete:'clear',x:'*',X:'*','×':'*','÷':'/'}[event.key]||event.key));
  if(/^[0-9.+\-*/=%]$/.test(key)||['back','clear'].includes(key)){
   event.preventDefault();enterCalc(key==='%'?'percent':key);
  }
 });
 calcDialog.addEventListener('click',event=>{
  if(event.target!==calcDialog)return;
  const rect=calcDialog.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)calcDialog.close();
 });
 async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('이 브라우저에서는 전체 화면을 지원하지 않습니다.')}catch(_){toast('브라우저에서 전체 화면 사용을 허용해 주세요.')}}
 $('fullMode').addEventListener('click',fullscreen);
 document.addEventListener('fullscreenchange',()=>$('fullMode').querySelector('span').textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면');
 document.addEventListener('keydown',event=>{if(calcDialog.open)return;if(event.key==='Escape'&&settings.zen)setZen(false);if(event.key.toLowerCase()==='f'&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&!(event.target instanceof HTMLInputElement))fullscreen()});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick(true);if(wakeRequested&&!wakeLock)acquireWakeLock()}});
 try{const zone=Intl.DateTimeFormat().resolvedOptions().timeZone;if(zone)$('zone').textContent=zone==='Asia/Seoul'?'대한민국 표준시 · KST':zone.replaceAll('_',' ')+' · 기기 시간'}catch(_){}
 sync();tick(true);renderCalcHistory();setInterval(tick,120);
})();
</script>
